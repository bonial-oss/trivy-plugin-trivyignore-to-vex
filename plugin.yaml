name: "trivyignore-to-vex"
version: "0.1.0"
repository: github.com/bonial-oss/trivy-plugin-trivyignore-to-vex
maintainer: "Bonial International GmbH"
output: false
summary: "Convert .trivyignore.yaml to OpenVEX documents"
description: |-
  Converts Trivy .trivyignore.yaml files into OpenVEX documents using
  pattern-based inference to derive VEX status from ignore statements.
  Supports metadata from Backstage catalog-info.yaml with CLI overrides.
platforms:
  - selector:
      os: darwin
      arch: amd64
    uri: https://github.com/bonial-oss/trivy-plugin-trivyignore-to-vex/releases/download/v0.1.0/trivyignore-to-vex_0.1.0_darwin-amd64.tar.gz
    bin: ./trivyignore-to-vex
  - selector:
      os: darwin
      arch: arm64
    uri: https://github.com/bonial-oss/trivy-plugin-trivyignore-to-vex/releases/download/v0.1.0/trivyignore-to-vex_0.1.0_darwin-arm64.tar.gz
    bin: ./trivyignore-to-vex
  - selector:
      os: linux
      arch: amd64
    uri: https://github.com/bonial-oss/trivy-plugin-trivyignore-to-vex/releases/download/v0.1.0/trivyignore-to-vex_0.1.0_linux-amd64.tar.gz
    bin: ./trivyignore-to-vex
  - selector:
      os: linux
      arch: arm64
    uri: https://github.com/bonial-oss/trivy-plugin-trivyignore-to-vex/releases/download/v0.1.0/trivyignore-to-vex_0.1.0_linux-arm64.tar.gz
    bin: ./trivyignore-to-vex
